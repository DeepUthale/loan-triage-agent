[project]
name = "loan-triage"
version = "0.1.0"
description = "Agentic mortgage-intake triage: LangGraph workflow with Claude extraction, deterministic credit-policy routing, and a human review queue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4,<3",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pdfplumber>=0.11",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6",
    "reportlab>=4.2",
    "streamlit>=1.50",
    "typer>=0.12",
]

[project.scripts]
loan-triage = "loan_triage.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loan_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S", "PTH", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"src/loan_triage/synth/**" = ["S311"]
"scripts/**" = ["S603", "S607", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["loan_triage"]

[[tool.mypy.overrides]]
module = [
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "httplib2.*",
    "pdfplumber.*",
    "reportlab.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["loan_triage.inbox.gmail"]
disallow_untyped_calls = false
warn_return_any = false

[tool.coverage.run]
source = ["loan_triage"]
branch = true
